<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .container{
            display: flex;
             /* flex-direction: row; 
             justify-content: start;
             flex-wrap: wrap;
             align-content: start; */
             /* height: 100dvh; */
             /* align-items: start; */
            /* height: 100dvh; */
            /* justify-content: end; */
        }
        .box1,.box2,.box3,.box4,.box5{
            background-color: blue;
            width: 100px;
            height: 100px;
            padding: 8px;
            color: red;
        }
    </style>
</head>
<body>
    <!--parent container/flex container-->
    <div class="container">
        <div class="box1">container1</div>
        <div class="box2">container2</div>
        <div class="box3">container3</div>
      <div class="box4">container4</div>
        <div class="box5">container5</div>
    </div>
</body>
</html>
