<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <style>
        *
        {
            box-sizing:border-box;
            /* box-sizing: content-box; */
        }
        h1{
            border: 1px solid green;
            padding: 5px;
            margin: 10px;  
        }
    </style>
</head>
<body>
    <h1>Hi Everyone</h1>
</body>
</html>
