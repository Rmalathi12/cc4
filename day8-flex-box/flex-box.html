<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        *{
            box-sizing: border-box;
            margin:0;
        }
        body{
            display:flex ;
            flex-direction: column;
            height: 100dvh;
            justify-content: end;

        }
        div{
            background-color: blue;
            width: 100px;
            height: 100px;
            color: red;
            padding: 8px;
        }

    </style>
</head>
<body>
    <div>container1</div>
    <div>container2</div>
    
</body>
</html>
