<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Area</title>
    <link rel="stylesheet" href="grid-area.css">
</head>
<body>
    <!--grid box-->
    <!--grid container-->
    <div class="grid-container">
    <div class="box" style="grid-area: item1">context1</div>
    <div class="box" style="grid-area: item2">context2</div>
    <div class="box" style="grid-area: item3">context3</div>
    <div class="box" style="grid-area: item4">context4</div>
    <div class="box" style="grid-area: item5">context5</div>
    <div class="box" style="grid-area: item6">context6</div>
    </div>
</body>
</html>
